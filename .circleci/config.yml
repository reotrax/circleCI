version: 2.1

orbs:
  node: circleci/node@5.1.0
  github-cli: circleci/github-cli@2.3.0

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.9.0
    steps:
      - checkout

      # 依存関係のキャッシュを復元
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "yarn.lock" }}
            - v1-dependencies-

      # 依存関係のインストール
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile

      # 依存関係をキャッシュ
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "yarn.lock" }}

      # リンター実行
      - run:
          name: Run linter
          command: yarn lint

      # テスト実行
      - run:
          name: Run tests with coverage
          command: yarn test:coverage

      # カバレッジレポートを保存
      - store_artifacts:
          path: coverage
          destination: coverage-report

      # PRにコメントを投稿
      - run:
          name: Post test coverage to PR
          command: |
            # デバッグ情報を表示
            echo "=== デバッグ情報 ==="
            echo "CIRCLE_PULL_REQUEST: ${CIRCLE_PULL_REQUEST:-未設定}"
            echo "現在のディレクトリ: $(pwd)"
            echo "環境変数:"
            env | sort
            
            if [ -n "$CIRCLE_PULL_REQUEST" ]; then
              # スクリプトのパスを設定
              SCRIPT_PATH=".circleci/scripts/comment-on-pr.sh"
              
              # スクリプトの存在確認
              if [ ! -f "$SCRIPT_PATH" ]; then
                echo "❌ エラー: スクリプトが見つかりません: $SCRIPT_PATH"
                echo "カレントディレクトリの内容:"
                ls -la
                echo "scripts ディレクトリの内容:"
                ls -la .circleci/scripts/ 2>/dev/null || echo "scripts ディレクトリが見つかりません"
                exit 1
              fi
              
              # スクリプトに実行権限を付与
              chmod +x "$SCRIPT_PATH"
              
              # スクリプトを実行
              echo "スクリプトを実行中: $SCRIPT_PATH"
              if ! "$SCRIPT_PATH"; then
                echo "❌ エラー: スクリプトの実行に失敗しました"
                exit 1
              fi
              
              echo "✅ スクリプトが正常に完了しました"
            else
              echo "PRではないため、カバレッジコメントはスキップされます"
            fi

      # ビルド実行
      - run:
          name: Build project
          command: yarn build

      # ビルド成果物を保存
      - store_artifacts:
          path: dist
          destination: build-output

      # ワークスペースに結果を保存（後続のジョブで使用）
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - coverage

  comment-on-pr:
    docker:
      - image: cimg/node:22.9.0
    steps:
      - checkout

      # ワークスペースから結果を取得
      - attach_workspace:
          at: .

      # GitHub CLIをセットアップ
      - github-cli/setup

      # GitHub認証の設定（OIDC → GITHUB_TOKEN のフォールバック）
      - run:
          name: Setup GitHub Authentication
          command: .circleci/scripts/setup-github-auth.sh

      # PRにコメントを投稿
      - run:
          name: Comment on PR
          command: .circleci/scripts/comment-on-pr.sh

workflows:
  build-and-comment:
    jobs:
      - build-and-test
      - comment-on-pr:
          requires:
            - build-and-test
          filters:
            branches:
              ignore: main
