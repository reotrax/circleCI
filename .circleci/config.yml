version: 2.1

orbs:
  node: circleci/node@5.1.0
  github-cli: circleci/github-cli@2.3.0

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.9.0
    steps:
      - checkout

      # 依存関係のキャッシュを復元
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "yarn.lock" }}
            - v1-dependencies-

      # 依存関係のインストール
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile

      # 依存関係をキャッシュ
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "yarn.lock" }}

      # リンター実行
      - run:
          name: Run linter
          command: yarn lint

      # ビルド実行
      - run:
          name: Build project
          command: yarn build

      # ビルド成果物を保存
      - store_artifacts:
          path: dist
          destination: build-output

      # ワークスペースに結果を保存（後続のジョブで使用）
      - persist_to_workspace:
          root: .
          paths:
            - dist

  comment-on-pr:
    docker:
      - image: cimg/node:22.9.0
    steps:
      - checkout

      # ワークスペースから結果を取得
      - attach_workspace:
          at: .

      # GitHub CLIをセットアップ
      - github-cli/setup

      # PRにコメントを投稿
      - run:
          name: Comment on PR
          command: |
            # PRの場合のみ実行
            if [ -n "$CIRCLE_PULL_REQUEST" ]; then
              # PR番号を抽出
              PR_NUMBER=$(echo $CIRCLE_PULL_REQUEST | sed 's/.*\/pull\///')

              # ビルド結果のサマリーを作成
              COMMENT_BODY=$(cat \<<EOF
            ## CircleCI Build Report

            ✅ Build successful

            **Build Details:**
            - **Workflow:** $CIRCLE_WORKFLOW_ID
            - **Job:** $CIRCLE_JOB
            - **Build Number:** $CIRCLE_BUILD_NUM
            - **Branch:** $CIRCLE_BRANCH

            **Artifacts:**
            - [View build artifacts]($CIRCLE_BUILD_URL/artifacts)

            **Results:**
            - ✅ Linting passed
            - ✅ Build completed successfully

            [View full build details]($CIRCLE_BUILD_URL)
            EOF
            )

              # GitHub CLIを使用してコメントを投稿
              echo "$COMMENT_BODY" | gh pr comment "$PR_NUMBER" --body-file -

              echo "Comment posted to PR #$PR_NUMBER"
            else
              echo "Not a pull request, skipping comment"
            fi

workflows:
  build-and-comment:
    jobs:
      - build-and-test
      - comment-on-pr:
          requires:
            - build-and-test
          filters:
            branches:
              ignore: main
